<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Belajar Tari Saman – Pose Coach</title>
    <style>
        :root {
            --bg: #0e0e0e;
            --card: #1a1a1a;
            --fg: #f4f4f4;
            --mut: #9a9a9a;
            --ok: #3ddc84
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.45 system-ui, sans-serif
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px
        }

        h1 {
            font-size: 18px;
            margin: 0
        }

        .tabs {
            display: flex;
            gap: 6px
        }

        button,
        select {
            background: var(--card);
            color: var(--fg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 14px;
            font: inherit;
            cursor: pointer
        }

        button.on {
            background: #fff;
            color: #000;
            border-color: #fff
        }

        button[hidden] {
            display: none
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px
        }

        .box {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9
        }

        .box>* {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        video,
        #ov {
            object-fit: cover;
            transform: scaleX(-1)
        }

        #ref {
            background: #fff
        }

        #intro {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: #000d;
            text-align: center;
            padding: 16px
        }

        #intro[hidden] {
            display: none
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 12px 16px 0
        }

        #bar {
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0
        }

        #bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--ok)
        }

        #lane {
            display: block;
            width: calc(100% - 32px);
            height: 130px;
            margin: 12px 16px 0;
            border-radius: 12px
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 12px 16px
        }

        .mut {
            color: var(--mut)
        }

        @media(max-width:800px) {
            main {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Tari Saman · Pose Coach</h1>
        <div class="tabs">
            <button data-m="learn" class="on">1 Belajar</button>
            <button data-m="practice">2 Latihan</button>
            <button data-m="test">3 Uji</button>
        </div>
    </header>
    <main>
        <div class="box">
            <video id="cam" playsinline muted></video><canvas id="ov"></canvas>
            <div id="intro"><b>Siapkan kamera</b>
                <span class="mut">Duduk tegak. Kedua bahu, siku, dan tangan harus terlihat penuh. Butuh internet untuk
                    memuat model.</span>
                <button id="go">Mulai kamera</button><small id="msg" class="mut"></small>
            </div>
        </div>
        <div class="box"><canvas id="ref"></canvas></div>
    </main>
    <div class="card"><b id="ttl"></b> <span class="mut" id="cue"></span>
        <div id="bar"><i></i></div>
        <div id="hint"></div>
    </div>
    <canvas id="lane"></canvas>
    <div class="row">
        <button id="play" hidden>Mulai</button>
        <label class="mut">Kecepatan <select id="spd">
                <option value=".5">0,5×</option>
                <option value=".75">0,75×</option>
                <option value="1">1×</option>
            </select></label>
        <label class="mut">Template dari video: <input type="file" id="file" accept=".json"></label>
        <span id="res"></span>
    </div>
    <p class="mut" style="padding:0 16px;font-size:13px">Urutan pose bawaan adalah draf ilustrasi dan belum divalidasi
        guru atau sanggar Saman. Ambang skor masih sementara dan belum dikalibrasi.</p>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
        const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
            MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";
        const $ = s => document.querySelector(s), U = a => { const n = Math.hypot(a[0], a[1]) || 1; return [a[0] / n, a[1] / n] };
        const NM = ["lengan atas kiri", "lengan bawah kiri", "lengan atas kanan", "lengan bawah kanan"];
        const mk = (a, b) => [a, b, [-a[0], a[1]], [-b[0], b[1]]].map(U);   // arah tulang [x kanan-gambar, y bawah]; kiri = +x
        let POSES = {
            siap: { n: "Siap", c: "Duduk tegak, kedua tangan di atas paha.", b: mk([.15, 1], [-.3, .95]) },
            dada: { n: "Tepuk dada", c: "Siku dekat badan, kedua telapak ke dada.", b: mk([.35, .94], [-.92, -.38]) },
            tangan: { n: "Tepuk tangan", c: "Siku terbuka ke samping, telapak bertemu di depan dada.", b: mk([.8, .6], [-.9, -.43]) },
            angkat: { n: "Angkat tangan", c: "Siku setinggi bahu, telapak menghadap atas.", b: mk([.85, -.1], [.2, -.98]) },
            silang: { n: "Silang", c: "Lengan bawah bersilang di depan dada.", b: mk([-.2, .98], [-.8, -.6]) }
        };
        let SEQ = ["siap", "dada", "tangan", "angkat", "silang", "tangan", "dada", "siap"], TB = SEQ.map((_, i) => i * 1.5), STEPS = [...new Set(SEQ)];
        const S = { mode: "learn", run: false, step: 0, hold: 0, sim: 0, err: [99, 99, 99, 99], ok: false, user: null, lm: null, speed: .5, notes: [], cur: null, t0: 0 };
        let pl, du, last = -1, tPrev = performance.now();
        const cam = $("#cam"), ov = $("#ov"), ref = $("#ref"), lane = $("#lane");

        const errs = t => S.user.map((u, i) => Math.acos(Math.max(-1, Math.min(1, u[0] * t[i][0] + u[1] * t[i][1]))) * 57.2958),
            sc = e => e.reduce((a, x) => a + Math.exp(-.5 * (x / 25) ** 2), 0) / 4;   // sigma 25° (sementara)

        function read(lm) {
            S.ok = [11, 12, 13, 14, 15, 16].every(i => lm[i].visibility > .5 && lm[i].x > 0 && lm[i].x < 1 && lm[i].y > 0 && lm[i].y < 1);
            if (!S.ok) return;
            const w = cam.videoWidth, h = cam.videoHeight, p = i => [lm[i].x * w, lm[i].y * h];
            const ex = U([p(11)[0] - p(12)[0], p(11)[1] - p(12)[1]]), ey = [-ex[1], ex[0]];
            const bone = (a, b) => { const d = [p(b)[0] - p(a)[0], p(b)[1] - p(a)[1]]; return U([d[0] * ex[0] + d[1] * ex[1], d[0] * ey[0] + d[1] * ey[1]]) };
            const nb = [bone(11, 13), bone(13, 15), bone(12, 14), bone(14, 16)];
            S.user = S.user ? nb.map((v, i) => U([S.user[i][0] * .5 + v[0] * .5, S.user[i][1] * .5 + v[1] * .5])) : nb;
        }
        const tgt = () => S.mode === "learn" ? POSES[STEPS[S.step]] : S.run && S.cur ? POSES[S.cur.p] : POSES[SEQ[0]];

        function setMode(m) {
            S.mode = m; S.run = false; S.step = 0; S.hold = 0; S.notes = [];
            document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === m));
            if (m === "test") $("#spd").value = "1"; else if (m === "practice") $("#spd").value = ".5";
            S.speed = +$("#spd").value;
            $("#spd").disabled = m !== "practice"; $("#play").hidden = m === "learn"; $("#play").textContent = "Mulai"; $("#res").textContent = "";
        }
        function finish() {
            S.run = false; const c = { PERFECT: 0, GOOD: 0, MISS: 0 }; S.notes.forEach(n => c[n.j]++);
            const s = Math.round((c.PERFECT * 100 + c.GOOD * 60) / S.notes.length); let best = "";
            if (S.mode === "test") { try { const k = "saman-best", o = +localStorage.getItem(k) || 0; if (s > o) localStorage.setItem(k, s); best = " · terbaik " + Math.max(s, o) } catch { } }
            $("#res").textContent = `Skor ${s} (${s >= 85 ? "Sangat baik" : s >= 65 ? "Baik" : s >= 40 ? "Cukup" : "Perlu latihan"}) — Perfect ${c.PERFECT}, Good ${c.GOOD}, Miss ${c.MISS}${best}`;
            $("#play").textContent = "Ulangi"; S.notes = [];
        }
        function update(dt, nw) {
            S.cur = S.run ? S.notes.find(n => !n.j) : null;
            const T = tgt(), can = S.ok && S.user;
            S.err = can ? errs(T.b) : [99, 99, 99, 99]; S.sim = can ? sc(S.err) : 0;
            if (S.mode === "learn") {
                S.hold = S.sim >= .72 ? S.hold + dt : Math.max(0, S.hold - 2 * dt);
                if (S.hold >= .8) {
                    S.hold = 0; S.step++;
                    if (S.step >= STEPS.length) { setMode("practice"); $("#res").textContent = "Semua langkah selesai. Coba Latihan pelan." }
                }
                return;
            }
            if (!S.run) return;
            const now = (nw - S.t0) / 1e3, W = .6 / S.speed;
            S.notes.forEach(n => {
                if (n.j) return;
                if (can && Math.abs(now - n.T) <= W) n.best = Math.max(n.best, sc(errs(POSES[n.p].b)));
                if (now > n.T + W) n.j = n.best >= .75 ? "PERFECT" : n.best >= .5 ? "GOOD" : "MISS";
            });
            if (S.notes.every(n => n.j)) finish();
        }

        function ctx(c) {
            const k = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
            if (c.width !== Math.round(W * k)) { c.width = Math.round(W * k); c.height = Math.round(H * k) }
            const x = c.getContext("2d"); x.setTransform(k, 0, 0, k, 0, 0); return [x, W, H]
        }
        function stick(c, b, x, y, s, col, lw) {   // tampilan cermin: sisi kiri anatomis di kiri layar
            c.save(); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = "round"; c.lineJoin = "round";
            const L = [x - .5 * s, y], R = [x + .5 * s, y],
                arm = (sh, u, f) => { const e = [sh[0] - u[0] * .8 * s, sh[1] + u[1] * .8 * s]; return [sh, e, [e[0] - f[0] * .7 * s, e[1] + f[1] * .7 * s]] },
                line = p => { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke() };
            line([L, R]); line(arm(L, b[0], b[1])); line(arm(R, b[2], b[3]));
            line([L, [x - .35 * s, y + 1.7 * s], [x + .35 * s, y + 1.7 * s], R]); line([[x, y], [x, y - .25 * s]]);
            c.beginPath(); c.arc(x, y - .55 * s, .3 * s, 0, 7); c.stroke(); c.restore();
        }
        function draw(nw) {
            const tp = tgt(), now = S.run ? (nw - S.t0) / 1e3 : 0;
            let [c, w, h] = ctx(ref); c.fillStyle = "#fff"; c.fillRect(0, 0, w, h);
            stick(c, tp.b, w / 2, h * .4, h * .24, "#000", Math.max(3, h / 70));
            if (S.ok && S.user) stick(c, S.user, w / 2, h * .4, h * .24, "rgba(46,204,113,.55)", Math.max(3, h / 70));

            const o = ov.getContext("2d"); o.clearRect(0, 0, ov.width, ov.height);
            if (S.lm && du) {
                du.drawConnectors(S.lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#ffffff88", lineWidth: 2 });
                du.drawLandmarks(S.lm, { color: "#fff", radius: 2 });
                if (S.ok) {
                    o.lineWidth = 7; o.lineCap = "round";
                    [[11, 13], [13, 15], [12, 14], [14, 16]].forEach(([a, b], i) => {
                        const e = S.err[i];
                        o.strokeStyle = e < 25 ? "#3ddc84" : e < 45 ? "#ffb74d" : "#ff5252"; o.beginPath();
                        o.moveTo(S.lm[a].x * ov.width, S.lm[a].y * ov.height); o.lineTo(S.lm[b].x * ov.width, S.lm[b].y * ov.height); o.stroke()
                    })
                }
            }

            let t1, t2 = tp.c;
            if (S.mode === "learn") t1 = `Langkah ${S.step + 1}/${STEPS.length} · ${tp.n}`;
            else if (S.run) t1 = now < 3 ? `Bersiap… ${Math.ceil(3 - now)}` : `Gerak ${S.notes.indexOf(S.cur) + 1}/${S.notes.length} · ${tp.n}`;
            else { t1 = S.mode === "test" ? "Uji · skor dihitung pada 1×" : "Latihan · pelan dulu"; t2 = "Tekan Mulai, lalu cocokkan pose saat kartu melewati garis putih." }
            $("#ttl").textContent = t1; $("#cue").textContent = t2;
            $("#bar i").style.width = (S.mode === "learn" ? Math.min(100, S.hold / .8 * 100) : S.sim * 100) + "%";
            $("#hint").textContent = !S.lm ? "Kamera belum menangkap tubuh." : !S.ok ? "Pastikan kedua bahu, siku, dan pergelangan tangan terlihat penuh di kamera."
                : `Kecocokan ${Math.round(S.sim * 100)}%` + (S.sim < .72 ? ` · perbaiki ${NM[S.err.indexOf(Math.max(...S.err))]}` : " · tahan pose");

            [c, w, h] = ctx(lane); c.fillStyle = "#161616"; c.fillRect(0, 0, w, h);
            const hx = w * .16, pps = 170 * S.speed;
            c.fillStyle = "#ffffff14"; c.fillRect(hx - 34, 0, 68, h); c.fillStyle = "#fff"; c.fillRect(hx - 1, 0, 2, h);
            if (!S.notes.length) {
                c.fillStyle = "#9a9a9a"; c.font = "14px system-ui"; c.textAlign = "center";
                c.fillText(S.mode === "learn" ? "Mode Belajar: kuasai tiap pose dulu. Lane aktif di Latihan dan Uji." : "Tekan Mulai", w / 2, h / 2)
            }
            S.notes.forEach(n => {
                const x = hx + (n.T - now) * pps; if (x < -40 || x > w + 40) return;
                c.fillStyle = n.j ? { PERFECT: "#3ddc84", GOOD: "#ffb74d", MISS: "#ff5252" }[n.j] : "#fff";
                c.beginPath(); c.roundRect(x - 28, 10, 56, h - 20, 10); c.fill();
                stick(c, POSES[n.p].b, x, h * .4, 12, "#000", 2);
                c.fillStyle = "#000"; c.font = "10px system-ui"; c.textAlign = "center"; c.fillText(n.j || POSES[n.p].n, x, h - 16)
            });
        }
        function frame() {
            requestAnimationFrame(frame);
            const nw = performance.now(), dt = Math.min(.1, (nw - tPrev) / 1e3); tPrev = nw;
            if (pl && cam.readyState >= 2 && cam.currentTime !== last) {
                last = cam.currentTime; const r = pl.detectForVideo(cam, nw);
                S.lm = r.landmarks[0] || null; S.lm ? read(S.lm) : (S.ok = false);
            }
            update(dt, nw); draw(nw);
        }

        async function start() {
            const msg = t => $("#msg").textContent = t; $("#go").disabled = true; msg("Meminta izin kamera…");
            try {
                cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 960 }, height: { ideal: 540 }, facingMode: "user" }, audio: false });
                await cam.play(); ov.width = cam.videoWidth; ov.height = cam.videoHeight; msg("Memuat model pose…");
                const v = await FilesetResolver.forVisionTasks(WASM), o = g => ({ baseOptions: { modelAssetPath: MODEL, delegate: g }, runningMode: "VIDEO", numPoses: 1 });
                try { pl = await PoseLandmarker.createFromOptions(v, o("GPU")) } catch { pl = await PoseLandmarker.createFromOptions(v, o("CPU")) }
                du = new DrawingUtils(ov.getContext("2d")); $("#intro").hidden = true;
            } catch (e) { msg("Gagal: " + e.message + ". Buka lewat http://localhost dan izinkan kamera."); $("#go").disabled = false }
        }
        $("#go").onclick = start;
        document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
        $("#spd").onchange = e => { S.speed = +e.target.value };
        $("#play").onclick = () => {
            if (S.run) { S.run = false; S.notes = []; $("#play").textContent = "Mulai"; return }
            if (!pl) { $("#res").textContent = "Mulai kamera dulu."; return }
            S.notes = SEQ.map((p, i) => ({ p, T: 3 + TB[i] / S.speed, best: 0, j: null })); S.t0 = performance.now(); S.run = true;
            $("#res").textContent = ""; $("#play").textContent = "Berhenti";
        };
        $("#file").onchange = async e => {   // template.json dari video2template.py
            try {
                const j = JSON.parse(await e.target.files[0].text()), K = ["L_upper", "L_fore", "R_upper", "R_fore"], P = {};
                j.poses.forEach(p => P[p.id] = { n: p.id, c: "Dari template hasil ekstraksi video.", b: K.map(k => U(p.bones[k].slice(0, 2))) });
                const tl = j.timeline.map(x => ({ p: x.pose, t: x.tStart ?? x.t })).sort((a, b) => a.t - b.t);
                POSES = P; SEQ = tl.map(x => x.p); TB = tl.map(x => x.t - tl[0].t); STEPS = [...new Set(SEQ)];
                setMode("learn"); $("#res").textContent = `Template dimuat: ${STEPS.length} pose, ${SEQ.length} gerak.`;
            } catch (err) { $("#res").textContent = "Template tidak valid: " + err.message }
        };
        setMode("learn"); requestAnimationFrame(frame);
    </script>
</body>

</html>
